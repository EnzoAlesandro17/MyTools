<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTools</title>
<link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
<header class="shell-header-band">
  <div class="wrap shell-head">
    <div class="shell-left">
      <button class="shell-brand" id="shellBrand" title="Ir a Inicio">MyTools</button>
      <div class="shell-date" id="shellDate"></div>
      <div class="shell-weather" id="shellWeather">Cargando clima…</div>
    </div>
    <div class="shell-status"><span class="dot"></span> Conectado a la base local (data/mytools.db)</div>
  </div>
</header>

<div class="page-content">
  <div id="root"></div>
</div>

<div class="overlay" id="forecastOverlay">
  <div class="modal narrow">
    <div class="modal-head">
      <h2 id="forecastTitle">Pronóstico</h2>
      <button class="close" id="forecastCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="forecast-list" id="forecastList"></div>
    </div>
  </div>
</div>

<script src="/shared/common.js"></script>
<script src="/modules/dashboard/dashboard.js"></script>
<script src="/modules/arqueo-caja/arqueo.js"></script>
<script src="/modules/control-ventas/control-ventas.js"></script>
<script src="/modules/control-fibra/fibra.js"></script>
<script src="/modules/enlaces/enlaces.js"></script>
<script src="/modules/configuracion/configuracion.js"></script>
<script>
(function(){
  // Para sumar una seccion nueva de nivel superior: 1) crear modules/<id>/<id>.js
  // con mount(root, ctx)/unmount(), 2) agregar su <script src> arriba, 3) agregar
  // una entrada aca abajo. Aparece sola como tarjeta en el dashboard (con stats
  // si se registra en modules/dashboard/dashboard.js).
  //
  // "Control de Ventas" es un hub: agrupa sus propias sub-secciones (hoy solo
  // Fibra óptica) en modules/control-ventas/control-ventas.js, no en esta lista.
  const SECTIONS = [
    { id: 'enlaces', code: 'EN', label: 'Enlaces útiles', desc: 'Links y páginas de referencia guardadas', module: () => window.EnlacesModule },
    { id: 'arqueo', code: 'AR', label: 'Arqueo de Caja', desc: 'Registro de arqueos por turno', module: () => window.ArqueoModule },
    { id: 'ventas', code: 'CV', label: 'Control de Ventas', desc: 'Gestión de ventas y servicios', module: () => window.ControlVentasModule },
    { id: 'config', code: 'CO', label: 'Configuración', desc: 'Ajustes generales de la aplicación', module: () => window.ConfiguracionModule },
  ];

  // Modulos anidados: no aparecen como tarjeta en Inicio, solo son alcanzables
  // desde el hub que los contiene (ctx.goTo sigue funcionando igual para ellos).
  const NESTED_MODULES = {
    fibra: window.FibraModule,
  };

  const MODULES = { dashboard: window.DashboardModule, ...NESTED_MODULES };
  SECTIONS.forEach(s => { MODULES[s.id] = s.module(); });

  const root = document.getElementById('root');
  let current = null;

  function activate(name){
    if(!MODULES[name] || name === current) return;
    if(current && MODULES[current]) MODULES[current].unmount();
    current = name;
    MODULES[name].mount(root, { goTo: activate, sections: SECTIONS });
  }

  document.getElementById('shellBrand').addEventListener('click', () => activate('dashboard'));

  async function refreshHeader(){
    document.getElementById('shellDate').textContent = window.App3.fmtDateLong(new Date());
    try{
      const cfg = await window.App3.api('/api/config');
      document.getElementById('shellBrand').textContent = cfg.nombre_negocio || 'MyTools';
    }catch(e){ /* si falla, se queda con el nombre por defecto */ }
    try{
      const w = await window.App3.api('/api/weather');
      const temp = (w.temp !== undefined && w.temp !== null) ? `${Math.round(w.temp)}°${w.unidadTemp || 'C'}` : '';
      const presion = (w.presion !== undefined && w.presion !== null) ? `${w.presion} ${w.unidadPresion || 'hPa'}` : '';
      const resto = `${temp}${temp ? ' ' : ''}${w.desc || ''}${presion ? ' · ' + presion : ''} · ${w.ciudad || ''}`.trim();
      document.getElementById('shellWeather').innerHTML = temp
        ? `<button type="button" id="shellWeatherBtn" class="weather-btn" title="Ver pronóstico de 7 días">${w.icon || '🌡️'} ${resto} <span class="weather-chevron">›</span></button>`
        : `${w.icon || '🌡️'} ${resto}`;
    }catch(e){
      document.getElementById('shellWeather').textContent = 'Clima no disponible';
    }
  }

  // ---------- Pronostico de 7 dias (modal, se abre al tocar la temperatura) ----------
  const DIAS_SEMANA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  function fmtDia(fecha, idx){
    const [y, m, d] = fecha.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    const etiqueta = idx === 0 ? 'Hoy' : DIAS_SEMANA[dt.getDay()];
    return `${String(d).padStart(2,'0')}-${String(m).padStart(2,'0')} (${etiqueta})`;
  }

  async function openForecast(){
    document.getElementById('forecastOverlay').classList.add('open');
    document.getElementById('forecastList').innerHTML = '<div class="cfg-empty">Cargando…</div>';
    try{
      const f = await window.App3.api('/api/weather/forecast');
      document.getElementById('forecastTitle').textContent = `Pronóstico 7 días · ${f.ciudad || ''}`;
      document.getElementById('forecastList').innerHTML = (f.dias || []).map((d, idx) => `
        <div class="forecast-row">
          <div class="forecast-day">${fmtDia(d.fecha, idx)}</div>
          <div class="forecast-desc"><span class="forecast-icon">${d.icon || '🌡️'}</span>${d.desc || ''}</div>
          <div class="forecast-temps">
            <span class="forecast-max">${d.tempMax !== null && d.tempMax !== undefined ? Math.round(d.tempMax) + '°' : '—'}</span>
            <span class="forecast-min">${d.tempMin !== null && d.tempMin !== undefined ? Math.round(d.tempMin) + '°' : '—'}</span>
          </div>
        </div>
      `).join('') || '<div class="cfg-empty">Sin datos disponibles.</div>';
    }catch(e){
      document.getElementById('forecastList').innerHTML = '<div class="cfg-empty">No se pudo cargar el pronóstico.</div>';
    }
  }
  function closeForecast(){ document.getElementById('forecastOverlay').classList.remove('open'); }

  document.getElementById('shellWeather').addEventListener('click', (e) => {
    if(e.target.closest('#shellWeatherBtn')) openForecast();
  });
  document.getElementById('forecastCloseBtn').addEventListener('click', closeForecast);
  document.getElementById('forecastOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'forecastOverlay') closeForecast();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && document.getElementById('forecastOverlay').classList.contains('open')) closeForecast();
  });

  window.App3Shell = { refreshHeader, goTo: activate };

  refreshHeader();
  activate('dashboard');
})();
</script>
</body>
</html>
